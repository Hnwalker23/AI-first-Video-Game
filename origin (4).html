<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORIGIN: The Choice Is Yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141f;
    --paper:#f2ede1;
    --paper-dim:#e7e0cf;
    --hero:#2f5fb3;
    --villain:#c1272d;
    --vigilante:#7b5ea7;
    --pow:#f5c542;
    --outline:#0b0b12;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle, rgba(11,11,18,0.08) 1px, transparent 1.2px) 0 0/14px 14px,
      var(--ink);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px 10px 40px;
    user-select:none;
  }
  .display{font-family:'Bangers', cursive; letter-spacing:1px;}
  #app{ width:100%; max-width:920px; }

  .panel{
    background:var(--paper);
    border:4px solid var(--outline);
    border-radius:4px;
    box-shadow:8px 8px 0 rgba(0,0,0,0.45);
    padding:26px 24px;
    position:relative;
    animation:fadein .3s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1;}}
  .chapter-tag{
    display:inline-block; font-family:'Oswald'; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    font-size:11px; background:var(--outline); color:var(--pow); padding:4px 10px; border-radius:3px; margin-bottom:14px;
  }
  h1.title{font-family:'Bangers'; font-size:52px; line-height:1; margin:0 0 6px; color:var(--outline);}
  h2.subtitle{font-family:'Bangers'; font-size:26px; margin:0 0 14px; color:var(--outline);}
  p{font-size:15.5px; line-height:1.55; margin:0 0 14px; color:#2a2a34;}
  .flavor{font-style:italic; color:#5a5a68; border-left:3px solid var(--pow); padding-left:12px; margin:14px 0;}
  .choices{display:flex; flex-direction:column; gap:9px; margin-top:16px;}
  button.choice{
    font-family:'Work Sans'; font-weight:600; font-size:14.5px; text-align:left;
    background:var(--paper); border:2.5px solid var(--outline); border-radius:8px; padding:12px 14px;
    cursor:pointer; color:var(--outline); box-shadow:3px 3px 0 var(--outline);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  button.choice:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--outline); background:#fffdf6;}
  button.choice:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--outline);}
  button.choice:disabled{opacity:.35; cursor:default;}
  button.primary{
    font-family:'Bangers'; font-size:19px; letter-spacing:1px; background:var(--pow);
    border:3px solid var(--outline); border-radius:8px; padding:13px 20px; cursor:pointer; color:var(--outline);
    box-shadow:4px 4px 0 var(--outline); transition:transform .1s ease, box-shadow .1s ease; display:block; width:100%; margin-top:6px;
  }
  button.primary:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--outline);}
  button.primary:active{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--outline);}
  button.primary:disabled{opacity:.4; cursor:not-allowed;}
  input[type=text]{
    font-family:'Work Sans'; font-size:16px; width:100%; padding:11px 12px; border:2.5px solid var(--outline);
    border-radius:6px; margin-bottom:16px; background:#fffdf6; color:var(--outline);
  }
  fieldset{border:none; padding:0; margin:0 0 18px;}
  legend{font-family:'Oswald'; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; font-size:12px; color:#5a5a68; margin-bottom:8px;}
  .pill-row{display:flex; gap:10px; flex-wrap:wrap;}
  .pill{font-family:'Oswald'; font-weight:600; font-size:13px; letter-spacing:0.5px; border:2.5px solid var(--outline);
    border-radius:20px; padding:9px 16px; cursor:pointer; background:#fffdf6; color:var(--outline);}
  .pill.active{background:var(--outline); color:var(--pow);}
  .loc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:520px){.loc-grid{grid-template-columns:1fr;}}
  .loc-card{border:2.5px solid var(--outline); border-radius:8px; padding:12px 14px; cursor:pointer; background:#fffdf6;}
  .loc-card.active{background:var(--outline); color:var(--paper);}
  .loc-card .lname{font-family:'Oswald'; font-weight:700; letter-spacing:0.5px; font-size:14px;}
  .loc-card .ldesc{font-size:12.5px; margin-top:3px; opacity:0.75; line-height:1.35;}
  .hp-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .hp-label{font-family:'Oswald'; font-size:11px; letter-spacing:1px; text-transform:uppercase; width:90px; flex-shrink:0;}
  .hp-track{flex:1; height:13px; background:#d9d2bf; border:2px solid var(--outline); border-radius:8px; overflow:hidden; position:relative;}
  .hp-fill{height:100%; background:var(--villain); transition:width .5s cubic-bezier(.3,.8,.4,1);}
  .hp-fill.player{background:var(--hero);}
  .hp-fill.boss{background:var(--villain);}

  /* ---- boss-fight hit feedback: real shake, flash, and damage numbers ---- */
  @keyframes cutShake{
    0%{transform:translate(0,0);} 15%{transform:translate(-7px,3px) rotate(-0.6deg);}
    30%{transform:translate(6px,-3px) rotate(0.5deg);} 45%{transform:translate(-5px,2px);}
    60%{transform:translate(4px,-2px);} 75%{transform:translate(-2px,1px);} 100%{transform:translate(0,0);}
  }
  .cut-shake{ animation:cutShake .4s ease; }
  .hit-flash{
    position:absolute; inset:0; background:rgba(193,39,45,0.32); pointer-events:none;
    border-radius:4px; animation:hitFlashAnim .45s ease forwards; z-index:5;
  }
  @keyframes hitFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .dmg-float{
    position:absolute; top:-4px; left:38%; font-family:'Bangers'; font-size:19px; letter-spacing:0.5px;
    pointer-events:none; text-shadow:1px 1px 0 rgba(0,0,0,0.4); animation:dmgFloatAnim 0.95s ease forwards; z-index:6;
  }
  @keyframes dmgFloatAnim{
    0%{ opacity:0; transform:translateY(2px) scale(0.8); }
    18%{ opacity:1; transform:translateY(-3px) scale(1.15); }
    100%{ opacity:0; transform:translateY(-34px) scale(1); }
  }
  .dmg-float.boss{ color:#e8757c; }
  .dmg-float.player{ color:#7ea1e8; }
  .powerlist{list-style:none; padding:0; margin:0 0 14px;}
  .powerlist li{background:var(--paper-dim); border:2px solid var(--outline); border-radius:6px; padding:10px 12px; margin-bottom:8px;}
  .powerlist .pname{display:block; font-family:'Oswald'; font-weight:700; letter-spacing:0.5px; font-size:14px; line-height:1.35;}
  .powerlist .pdesc{display:block; font-size:13px; color:#5a5a68; margin-top:6px; line-height:1.4;}
  .stamp-wrap{display:flex; justify-content:center; margin:8px 0 20px;}
  .stamp{font-family:'Bangers'; font-size:32px; letter-spacing:2px; border:6px solid currentColor; border-radius:10px;
    padding:14px 24px; text-align:center; transform:rotate(-6deg) scale(0); animation:stamp-in .45s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay:.15s;}
  .stamp .sub{display:block; font-family:'Oswald'; font-size:12px; letter-spacing:2px; margin-top:2px;}
  @keyframes stamp-in{to{transform:rotate(-6deg) scale(1);}}
  .stamp.hero{color:var(--hero);} .stamp.villain{color:var(--villain);} .stamp.vigilante{color:var(--vigilante);}
  .final-pcts{display:flex; gap:16px; margin:18px 0; justify-content:center;}
  .final-pcts div{text-align:center;} .final-pcts .n{font-family:'Bangers'; font-size:22px;}
  .final-pcts .l{font-family:'Oswald'; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#5a5a68;}

  .meter-bar{display:flex; gap:6px; margin-bottom:8px; background:rgba(242,237,225,0.08); border:2px solid rgba(242,237,225,0.18); border-radius:10px; padding:8px 10px;}
  .meter{flex:1; text-align:center;}
  .meter .pct{font-family:'Bangers'; font-size:19px; color:var(--paper); line-height:1; transition:color .15s ease;}
  .meter .name{font-family:'Oswald'; font-size:9px; letter-spacing:1.2px; color:rgba(242,237,225,0.65); text-transform:uppercase; margin-top:1px;}
  .meter.hero .pct{color:#7ea1e8;} .meter.villain .pct{color:#e8757c;} .meter.vigilante .pct{color:#b79fe0;}
  .meter-track{height:6px; border-radius:4px; background:rgba(0,0,0,0.4); margin-top:5px; overflow:hidden;}
  .meter-fill{height:100%; border-radius:4px; transition:width 0.4s ease-out;}
  .meter.hero .meter-fill{background:var(--hero);} .meter.villain .meter-fill{background:var(--villain);} .meter.vigilante .meter-fill{background:var(--vigilante);}

  /* ---- persistent live meter bar (always on top, even over cutscenes) ---- */
  #meterBarFixed{
    position:fixed; top:0; left:0; right:0; z-index:300;
    display:none; justify-content:center; padding:8px 10px 6px; background:rgba(11,11,18,0.92);
    border-bottom:2px solid rgba(242,237,225,0.18); backdrop-filter:blur(2px);
  }
  #meterBarInnerWrap{ width:100%; max-width:920px; position:relative; }
  #meterBarFixed .meter-bar{ margin-bottom:0; }
  #meterFloaters{ position:absolute; left:0; right:0; top:100%; height:0; pointer-events:none; }
  .meter-float{
    position:absolute; top:2px; font-family:'Bangers'; font-size:13px; letter-spacing:0.5px;
    padding:2px 8px; border-radius:12px; background:rgba(11,11,18,0.85); white-space:nowrap;
    animation:meterFloatUp 1.4s ease forwards;
  }
  .meter-float.hero{ color:#7ea1e8; left:16%; }
  .meter-float.villain{ color:#e8757c; left:50%; margin-left:-40px; }
  .meter-float.vigilante{ color:#b79fe0; right:16%; }
  @keyframes meterFloatUp{
    0%{ opacity:0; transform:translateY(0) scale(0.85); }
    15%{ opacity:1; transform:translateY(2px) scale(1.05); }
    30%{ transform:translateY(0) scale(1); }
    75%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-22px) scale(0.95); }
  }
  body.has-meter-bar{ padding-top:66px; }
  @media(max-width:640px){ #meterBarFixed{ padding:6px 6px 5px; } .meter .pct{ font-size:16px; } body.has-meter-bar{ padding-top:64px; } }

  /* ---- character creator ---- */
  .creator-wrap{display:flex; gap:20px; align-items:flex-start;}
  .creator-preview{flex:0 0 220px;}
  .creator-preview canvas{width:100%; aspect-ratio:3/4; border:3px solid var(--outline); border-radius:8px; background:linear-gradient(#3a4a68,#22283a); display:block;}
  .preview-hint{text-align:center; font-size:11px; color:#8a8a96; margin-top:6px; font-family:'Oswald'; letter-spacing:0.5px;}
  .creator-controls{flex:1; min-width:0;}
  @media(max-width:640px){.creator-wrap{flex-direction:column;} .creator-preview{flex:0 0 auto; width:55%; margin:0 auto 6px;}}
  .swatch-row{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:4px;}
  .swatch{width:30px; height:30px; border-radius:50%; border:2.5px solid var(--outline); cursor:pointer; flex-shrink:0;}
  .swatch.active{box-shadow:0 0 0 3px #fffdf6, 0 0 0 5.5px var(--outline); transform:scale(1.05);}

  /* ---- game screen ---- */
  #gameWrap{ position:relative; width:100%; }
  #hud2{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  #chapterLabel{
    font-family:'Bangers'; color:var(--pow); font-size:16px; letter-spacing:1px;
    background:var(--outline); padding:6px 12px; border-radius:6px; white-space:nowrap;
  }
  #objective{
    font-family:'Oswald'; font-weight:700; font-size:13px; letter-spacing:0.4px; color:var(--pow);
    background:rgba(11,11,18,0.65); padding:7px 12px; border-radius:6px; border:1.5px solid rgba(245,197,66,0.5);
    text-align:right; flex:1; min-width:180px;
  }
  #canvasFrame{
    border:4px solid var(--outline); border-radius:6px; overflow:hidden; position:relative;
    box-shadow:8px 8px 0 rgba(0,0,0,0.45); background:#1b1f2e; line-height:0;
  }
  #roomCanvas{ display:block; width:100%; aspect-ratio:900/520; touch-action:none; }
  #roomLabel{
    position:absolute; top:8px; left:8px; font-family:'Bangers'; font-size:14px; letter-spacing:1px;
    background:rgba(11,11,18,0.72); color:var(--paper); padding:4px 10px; border-radius:5px; pointer-events:none;
  }
  #promptRow{ display:flex; justify-content:center; margin-top:10px; min-height:44px; }
  #promptBtn{
    font-family:'Bangers'; font-size:15px; letter-spacing:0.5px; background:var(--pow); border:3px solid var(--outline);
    border-radius:8px; padding:9px 18px; cursor:pointer; color:var(--outline); box-shadow:3px 3px 0 var(--outline);
  }
  #promptBtn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--outline); }
  #promptBtn.hidden{ display:none; }
  #moveRow{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:14px; }
  .movebtn{
    width:64px; height:56px; background:var(--paper); border:2.5px solid var(--outline); border-radius:10px;
    font-family:'Bangers'; font-size:22px; color:var(--outline); box-shadow:2px 2px 0 var(--outline); cursor:pointer;
  }
  .movebtn:active{ transform:translate(1px,1px); box-shadow:none; }
  .hint{ text-align:center; font-family:'Oswald'; font-size:10.5px; letter-spacing:1px; color:rgba(242,237,225,0.45); margin-top:8px; text-transform:uppercase; }

  /* ---- cutscene overlay ---- */
  #cutOverlay{ position:fixed; inset:0; background:rgba(11,11,18,0.78); display:flex; align-items:center; justify-content:center; padding:16px; z-index:200; }
  #cutOverlay.hidden{ display:none; }
  #cutOverlay .panel{ width:100%; max-width:600px; max-height:92vh; overflow-y:auto; }
  .stage-row{ display:flex; justify-content:center; gap:16px; margin-bottom:14px; }
  .stage-portrait{ text-align:center; }
  .stage-portrait canvas{ width:110px; height:140px; background:linear-gradient(#3a4a68,#22283a); border:3px solid var(--outline); border-radius:8px; }
  .stage-portrait.dim canvas{ opacity:0.45; }
  .stage-portrait .who{ font-family:'Oswald'; font-weight:700; font-size:10.5px; letter-spacing:0.5px; margin-top:4px; text-transform:uppercase; color:#5a5a68; }
  .cut-solo{ display:flex; justify-content:center; margin-bottom:12px; }
  .cut-solo canvas{ width:170px; height:220px; background:linear-gradient(#3a4a68,#22283a); border:3px solid var(--outline); border-radius:10px; }
  .dialogue-box{ min-height:56px; }
  .dialogue-box .cursor{ display:inline-block; width:8px; }

  footer.note{text-align:center; color:rgba(242,237,225,0.35); font-family:'Oswald'; font-size:11px; letter-spacing:1px; margin-top:16px;}
</style>
</head>
<body>
<div id="app"></div>
<footer class="note">ORIGIN — walk the halls, make the choice, become the story</footer>

<script>
/* ============================================================
   APPEARANCE OPTIONS
   ============================================================ */
const SKIN_TONES = ["#ffdfc4","#f0c39e","#c68863","#8d5a3b","#5c3a26"];
const HAIR_COLORS = ["#181210","#3a2414","#7a4a24","#c99a3e","#8a1f1f","#e5e5e5","#3f6bd6","#c23fb0"];
const HAIR_STYLES = ["bald","short","long","mohawk"];
const OUTFIT_COLORS = ["#c1272d","#2f5fb3","#14141f","#1f8a4c","#7b5ea7","#e0a318","#e7e0cf","#1e8a8a"];
const ACCENT_COLORS = ["#14141f","#f5c542","#e7e0cf","#c1272d","#2f5fb3","#1e8a8a","#7b5ea7","#8d5a3b"];

function defaultAppearance(){
  return { skin:SKIN_TONES[0], hairColor:HAIR_COLORS[0], hairStyle:"short", outfitPrimary:OUTFIT_COLORS[1], outfitAccent:ACCENT_COLORS[1] };
}

/* ============================================================
   STORY DATA — powers, locations, chapters, dialogue
   ============================================================ */

/* Each power carries a "flavor" — which of the three traits it narratively leans toward.
   The origin power (see ORIGIN_POWER_BY_LOCATION below) is chosen deterministically to match
   the specific manifestation text; pickPowerByFlavor() handles later power grants, weighting
   toward whichever combat action triggered them. */
const POWERS = {
  hydro:{name:"Hydrokinesis", desc:"Command and shape water at will.", loc:"coastal", flavor:"hero"},
  storm:{name:"Storm Calling", desc:"Summon wind, rain, and lightning.", loc:"coastal", flavor:"villain"},
  tidal:{name:"Tidal Strength", desc:"Physical power that surges like the tide.", loc:"coastal", flavor:"vigilante"},
  aquavoice:{name:"Aquatic Resonance", desc:"Communicate with and command sea life.", loc:"coastal", flavor:"hero"},
  geokin:{name:"Stoneform", desc:"Harden skin to living granite on command.", loc:"mountain", flavor:"hero"},
  cryo:{name:"Cryokinesis", desc:"Generate and control ice and frost.", loc:"mountain", flavor:"villain"},
  windwalk:{name:"Windwalking", desc:"Ride mountain thermals in true flight.", loc:"mountain", flavor:"vigilante"},
  stamina:{name:"Iron Lungs", desc:"Superhuman endurance and stamina.", loc:"mountain", flavor:"hero"},
  solar:{name:"Solar Core", desc:"Absorb and release stored sunlight as energy.", loc:"desert", flavor:"hero"},
  heat:{name:"Pyrokinesis", desc:"Generate and control intense heat.", loc:"desert", flavor:"villain"},
  sand:{name:"Sandforge", desc:"Shape and harden sand into weapons or armor.", loc:"desert", flavor:"villain"},
  mirage:{name:"Mirage Weaving", desc:"Bend light to cast convincing illusions.", loc:"desert", flavor:"vigilante"},
  flora:{name:"Verdant Call", desc:"Grow and command plant life instantly.", loc:"forest", flavor:"hero"},
  beastspeak:{name:"Beast-Speak", desc:"Communicate with and rally wild animals.", loc:"forest", flavor:"hero"},
  regen:{name:"Regeneration", desc:"Heal from wounds at an accelerated rate.", loc:"forest", flavor:"hero"},
  camo:{name:"Adaptive Camouflage", desc:"Blend into any surrounding instantly.", loc:"forest", flavor:"vigilante"},
  techno:{name:"Technopathy", desc:"Interface with and control electronics by thought.", loc:"urban", flavor:"vigilante"},
  superstr:{name:"Augmented Strength", desc:"Raw physical power far past human limits.", loc:"urban", flavor:"villain"},
  metal:{name:"Ferrokinesis", desc:"Bend and shape metal like clay.", loc:"urban", flavor:"villain"},
  construct:{name:"Hard-Light Constructs", desc:"Build solid tools and shields from raw energy.", loc:"urban", flavor:"hero"},
  telekin:{name:"Telekinesis", desc:"Move objects and people with pure will.", loc:"universal", flavor:"vigilante"},
  speed:{name:"Velocity", desc:"Move, think, and react at superhuman speed.", loc:"universal", flavor:"hero"},
  telepath:{name:"Telepathy", desc:"Read surface thoughts and project your own.", loc:"universal", flavor:"vigilante"},
  invuln:{name:"Density Shift", desc:"Turn near-invulnerable at will.", loc:"universal", flavor:"hero"}
};

const LOCATIONS = [
  {id:"coastal", name:"Bay Harbor High", tagline:"A coastal city where the docks never sleep.", pool:["hydro","storm","tidal","aquavoice"]},
  {id:"mountain", name:"Cairnridge High", tagline:"A mountain town wrapped in cold, thin air.", pool:["geokin","cryo","windwalk","stamina"]},
  {id:"desert", name:"Solmere High", tagline:"A sun-scorched desert metro that never cools down.", pool:["solar","heat","sand","mirage"]},
  {id:"forest", name:"Thornwood High", tagline:"A forest valley town, half-swallowed by green.", pool:["flora","beastspeak","regen","camo"]},
  {id:"urban", name:"Ironvale High", tagline:"A dense, humming industrial sprawl.", pool:["techno","superstr","metal","construct"]}
];

/* Deterministic on purpose: the origin event's flavor text describes a very specific
   manifestation per town (water bending to your hand in the coastal script, frost at your
   feet in the mountain one, etc.) — so the power you actually wake up with has to be the one
   that matches what was just described, not a random draw from the town's whole pool. */
const ORIGIN_POWER_BY_LOCATION = { coastal:"hydro", mountain:"cryo", desert:"heat", forest:"flora", urban:"techno" };

/* For power grants that AREN'T tied to specific origin-text (e.g. the mid-story "power surge"
   during the Junior Year boss fight), the power still isn't pure luck — it's weighted toward
   whichever combat action you just took: an aggressive villainous action surges you toward an
   aggressive power, a controlled heroic one toward a controlled power, and so on. */
function pickPowerByFlavor(locId, flavor, exclude){
  exclude = exclude || [];
  const loc = LOCATIONS.find(l=>l.id===locId);
  const useUniversal = Math.random() < 0.15;
  let pool = useUniversal ? Object.keys(POWERS).filter(k=>POWERS[k].loc==="universal") : loc.pool.slice();
  pool = pool.filter(k=>!exclude.includes(k));
  let matching = pool.filter(k=>POWERS[k].flavor===flavor);
  if(matching.length===0) matching = pool.length ? pool : Object.keys(POWERS).filter(k=>!exclude.includes(k));
  return matching[Math.floor(Math.random()*matching.length)];
}

const ORIGIN_MANIFESTATIONS = {
  coastal:  "every sprinkler head in the gym snaps on at once, the spray curving in midair toward your outstretched hand",
  mountain: "frost spreads out from your feet in a perfect ring across the gym floor",
  desert:   "the air over your skin shimmers with sudden, impossible heat, and the kid next to you steps back",
  forest:   "the potted plant by the bleachers snaps upright and leans toward you like it's chasing sunlight",
  urban:    "every light in the gym flickers, surging brighter each time it points toward your hand"
};

/* ADJUSTED DECISION WEIGHTS: Small=1-2, Med=3-4, Big/Boss=5-8 */
const FRESHMAN_POOL = [
  { tag:"Locker Bully", npcName:"A Junior", grantsPower:false,
    text:"First week. A junior corners a smaller freshman by the lockers, laughing while their books scatter across the floor.",
    choices:[

/* Each chapter's day-to-day events are independent vignettes (none of them reference each
   other), so which order you hit them in can safely vary without contradicting anything —
   truly shuffled every playthrough, like a gamebook where the page order changes but you
   still read every page. The fight/boss step always stays last as the chapter's climax; the
   Freshman origin event always stays first since it's the moment your powers actually start. */
const CHAPTERS = [
  { name:"Freshman Year", intro:"First year. New building, new faces, and a body that's starting to do things it shouldn't.",
    steps:[
      {room:"hallway", event:FRESHMAN_POOL[0]},
      {room:"gym", event:FRESHMAN_POOL[1]},
      {room:"hallway", event:FRESHMAN_POOL[2]},
      {room:"library", event:FRESHMAN_POOL[3]},
      {room:"classroom", event:FRESHMAN_POOL[4]},
      {room:"courtyard", event:FRESHMAN_FIGHT, isFight:true}
    ],
    pinnedFirst:[1], pinnedLast:[5]
  },
  { name:"Sophomore Year", intro:"A year in, and the choices are starting to add up to something.",
    steps:[
      {room:"gym", event:SOPHOMORE_POOL[0]},
      {room:"classroom", event:SOPHOMORE_POOL[1]},
      {room:"cafeteria", event:SOPHOMORE_POOL[2]},
      {room:"home", event:SOPHOMORE_POOL[3]},
      {room:"courtyard", event:SOPHOMORE_FIGHT, isFight:true}
    ],
    pinnedLast:[4]
  },
  { name:"Junior Year", intro:"People are starting to notice. Some of them want something from you.",
    steps:[
      {room:"gym", event:JUNIOR_POOL[0]},
      {room:"courtyard", event:JUNIOR_POOL[1]},
      {room:"courtyard", event:JUNIOR_BOSS, isBoss:true}
    ],
    pinnedLast:[2]
  },
  { name:"Senior Year", intro:"Last year. Whatever you've become by now, it's about to become official.",
    steps:[
      {room:"courtyard", event:SENIOR_POOL[0]},
      {room:"library", event:SENIOR_POOL[1]},
      {room:"gym", event:FINAL_BOSS, isBoss:true}
    ],
    pinnedLast:[2]
  }
];

/* ============================================================
   GAME STATE
   ============================================================ */

let S = null;
function newState(){
  return { name:"", gender:"", locationId:"", hero:10, villain:10, vigilante:10, powers:[], log:[],
    appearance: defaultAppearance(), chapterIndex:0, stepIndex:0, room:"hallway", playerX:800,
    doneAmbient:{}, aliasName:"", chapterOrders:{} };
}

/* Every call to applyAlign() is the single choke point through which EVERY decision in
   the game (small talk-it-out choices, fight rounds, boss rounds) passes. Centralizing the
   meter refresh + on-screen feedback here guarantees no decision can update S.hero/villain/
   vigilante without the visible meter and floaters reflecting it immediately. */
function applyAlign(a){
  const before = { hero:S.hero, villain:S.villain, vigilante:S.vigilante };
  S.hero = Math.max(1, S.hero + (a.h||0));
  S.villain = Math.max(1, S.villain + (a.v||0));
  S.vigilante = Math.max(1, S.vigilante + (a.g||0));
  refreshMeterBar({
    h: S.hero - before.hero,
    v: S.villain - before.villain,
    g: S.vigilante - before.vigilante
  });
}

function pcts(){
  const total = S.hero + S.villain + S.vigilante;
  return {
    hero: Math.round((S.hero / total) * 100),
    villain: Math.round((S.villain / total) * 100),
    vigilante: Math.round((S.vigilante / total) * 100)
  };
}

function meterBarInnerHTML(){
  const p = pcts();
  return `
    <div class="meter hero"><div class="pct" id="mHeroPct">${p.hero}%</div><div class="name">Hero</div><div class="meter-track"><div class="meter-fill" id="mHeroFill" style="width:${p.hero}%"></div></div></div>
    <div class="meter villain"><div class="pct" id="mVillainPct">${p.villain}%</div><div class="name">Villain</div><div class="meter-track"><div class="meter-fill" id="mVillainFill" style="width:${p.villain}%"></div></div></div>
    <div class="meter vigilante"><div class="pct" id="mVigPct">${p.vigilante}%</div><div class="name">Vigilante</div><div class="meter-track"><div class="meter-fill" id="mVigFill" style="width:${p.vigilante}%"></div></div></div>
  `;
}

/* Shows the persistent, always-on-top meter bar. It lives outside #app (appended to <body>)
   so it stays visible even while a cutscene overlay (z-index 200) is covering the game —
   the whole point being: the moment you tap a choice, you SEE the bar move. */
function ensureMeterBar(){
  let el = document.getElementById("meterBarFixed");
  if(!el){
    el = document.createElement("div");
    el.id = "meterBarFixed";
    el.innerHTML = `<div id="meterBarInnerWrap"><div class="meter-bar" id="meterBarInner">${meterBarInnerHTML()}</div><div id="meterFloaters"></div></div>`;
    document.body.appendChild(el);
  }
  el.style.display = "flex";
  document.body.classList.add("has-meter-bar");
  refreshMeterBar();
  return el;
}
function hideMeterBar(){
  const el = document.getElementById("meterBarFixed");
  if(el) el.style.display = "none";
  document.body.classList.remove("has-meter-bar");
}

function refreshMeterBar(delta){
  const el = document.getElementById("meterBarFixed");
  if(!el || el.style.display==="none") return;
  const p = pcts();
  setMeterCell("mHeroPct","mHeroFill",p.hero);
  setMeterCell("mVillainPct","mVillainFill",p.villain);
  setMeterCell("mVigPct","mVigFill",p.vigilante);
  if(delta && (delta.h||delta.v||delta.g)) spawnMeterFloaters(delta);
}
function setMeterCell(pctId, fillId, val){
  const pctEl = document.getElementById(pctId);
  const fillEl = document.getElementById(fillId);
  if(pctEl) pctEl.textContent = val+"%";
  if(fillEl) fillEl.style.width = val+"%";
}
function spawnMeterFloaters(delta){
  const wrap = document.getElementById("meterFloaters");
  if(!wrap) return;
  const defs = [
    {k:"h", cls:"hero", label:"HERO"},
    {k:"v", cls:"villain", label:"VILLAIN"},
    {k:"g", cls:"vigilante", label:"VIGILANTE"}
  ];
  defs.forEach(d=>{
    const val = delta[d.k];
    if(!val) return;
    const f = document.createElement("div");
    f.className = "meter-float "+d.cls;
    f.textContent = (val>0?"+":"")+val+" "+d.label;
    wrap.appendChild(f);
    setTimeout(()=>{ f.remove(); }, 1450);
  });
}

function currentChapter(){ return CHAPTERS[S.chapterIndex]; }
function leadingTrait(){
  const p = pcts();
  if(p.hero>=p.villain && p.hero>=p.vigilante) return "hero";
  if(p.villain>=p.hero && p.villain>=p.vigilante) return "villain";
  return "vigilante";
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Decides — once per chapter, the first time it's needed — what order this chapter's events
   play out in. pinnedFirst/pinnedLast stay put (the Freshman origin moment always opens the
   game, the fight/boss always closes out the chapter); everything else is genuinely shuffled,
   a different order every playthrough. Every event in the chapter still happens — like a
   gamebook you can flip open to a different page first but still end up reading cover to
   cover. */
function ensureChapterOrder(idx){
  if(S.chapterOrders[idx]) return S.chapterOrders[idx];
  const ch = CHAPTERS[idx];
  const pinnedFirst = ch.pinnedFirst || [];
  const pinnedLast = ch.pinnedLast || [];
  const reorderable = ch.steps.map((_,i)=>i).filter(i=>!pinnedFirst.includes(i) && !pinnedLast.includes(i));
  const order = [...pinnedFirst, ...shuffle(reorderable), ...pinnedLast];
  S.chapterOrders[idx] = order;
  return order;
}
function currentStep(){
  const ch = currentChapter();
  const order = ensureChapterOrder(S.chapterIndex);
  const idx = order[S.stepIndex];
  return ch.steps[idx] || null;
}

/* ============================================================
   2D HUMAN CHARACTER DRAWING (FIXED TRANSLUCENCY & GRAPHICS)
   ============================================================ */

/* Lightens (positive percent) or darkens (negative) a hex color — used throughout drawHuman
   for simple gradient shading instead of flat fills, and for the ink-outline pass that gives
   characters a cleaner "inked comic panel" look matching the rest of the UI's bold borders. */
function shadeColor(hex, percent){
  if(typeof hex !== "string" || hex.charAt(0) !== "#") hex = "#808080"; // safe fallback — never let a bad color crash the render loop
  const f = parseInt(hex.slice(1),16);
  const t = percent<0 ? 0 : 255;
  const p = Math.abs(percent)/100;
  const R = f>>16, G = (f>>8)&0x00FF, B = f&0x0000FF;
  const nr = Math.round((t-R)*p)+R, ng = Math.round((t-G)*p)+G, nb = Math.round((t-B)*p)+B;
  return "#"+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
}
function drawHuman(ctx, cx, groundY, scale, app, opts){
  opts = opts || {};
  const facing = opts.facing || 1;
  const walkPhase = opts.walkPhase || 0;
  const walking = !!opts.walking;
  const talkPhase = opts.talkPhase || 0;
  const talking = !!opts.talking;
  const gesture = opts.gesture || "idle";
  const idlePhase = opts.idlePhase || 0;
  const INK = "rgba(11,11,18,0.55)";
  // Defense in depth: even if an appearance object comes in with a missing field (a bad NPC
  // hash, a malformed save, whatever), fall back to a sane default instead of crashing the
  // whole render loop over one NPC's hair color.
  app = {
    skin: app.skin || "#f0c39e",
    hairColor: app.hairColor || "#3a2414",
    hairStyle: app.hairStyle || "short",
    outfitPrimary: app.outfitPrimary || "#2f5fb3",
    outfitAccent: app.outfitAccent || "#f5c542"
  };

  ctx.save();
  ctx.translate(cx, groundY);
  if(facing<0) ctx.scale(-1,1);

  const bob = walking ? Math.sin(walkPhase*2)*2*scale : Math.sin(idlePhase)*1.2*scale;
  ctx.translate(0, bob);

  const legLen = 46*scale, torsoH = 46*scale, torsoW = 30*scale, headR = 15*scale, armLen = 40*scale;
  const hipY = -legLen, torsoTopY = hipY - torsoH, shoulderY = torsoTopY + 6*scale, headCY = torsoTopY - headR - 3*scale;

  // Ground shadow, soft-edged
  const shadowGrad = ctx.createRadialGradient(0,3*scale,1,0,3*scale,20*scale);
  shadowGrad.addColorStop(0,"rgba(10,10,16,0.42)");
  shadowGrad.addColorStop(1,"rgba(10,10,16,0)");
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.ellipse(0, 3*scale, 20*scale, 5*scale, 0, 0, Math.PI*2);
  ctx.fill();

  const legSwing = walking ? Math.sin(walkPhase)*0.5 : 0;
  const legColor = "#1a1a24";
  const bootColor = "#0d0d14";

  // Back leg
  drawLimb(ctx, -8*scale, hipY, legLen, 9*scale, legSwing, legColor);
  ctx.fillStyle = bootColor;
  roundRect(ctx, -12*scale, hipY + legLen - 8*scale, 10*scale, 9*scale, 2*scale);
  ctx.fill(); ctx.lineWidth=1.2; ctx.strokeStyle=INK; ctx.stroke();

  // Torso — shaded gradient instead of a flat fill
  const torsoGrad = ctx.createLinearGradient(-torsoW/2, torsoTopY, torsoW/2, torsoTopY+torsoH);
  torsoGrad.addColorStop(0, shadeColor(app.outfitPrimary, 16));
  torsoGrad.addColorStop(1, shadeColor(app.outfitPrimary, -14));
  ctx.fillStyle = torsoGrad;
  roundRect(ctx, -torsoW/2, torsoTopY, torsoW, torsoH, 8*scale);
  ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle=INK; ctx.stroke();

  // Chest accent stripe
  ctx.fillStyle = app.outfitAccent;
  roundRect(ctx, -torsoW/2+4*scale, torsoTopY+6*scale, torsoW-8*scale, 10*scale, 3*scale);
  ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle=INK; ctx.stroke();

  // Belt
  ctx.fillStyle = "#111";
  ctx.fillRect(-torsoW/2 - 1*scale, hipY - 6*scale, torsoW + 2*scale, 5*scale);
  ctx.fillStyle = app.outfitAccent;
  ctx.fillRect(-4*scale, hipY - 6.5*scale, 8*scale, 6*scale);
  ctx.lineWidth=1; ctx.strokeStyle=INK; ctx.strokeRect(-4*scale, hipY - 6.5*scale, 8*scale, 6*scale);

  // Front leg
  drawLimb(ctx, 8*scale, hipY, legLen, 9*scale, -legSwing, legColor);
  ctx.fillStyle = bootColor;
  roundRect(ctx, 4*scale, hipY + legLen - 8*scale, 10*scale, 9*scale, 2*scale);
  ctx.fill(); ctx.lineWidth=1.2; ctx.strokeStyle=INK; ctx.stroke();

  // Arms
  let armSwingL = walking ? -Math.sin(walkPhase)*0.5 : 0;
  let armSwingR = walking ? Math.sin(walkPhase)*0.5 : 0;
  if(gesture==="heroic"){ armSwingL = -2.4; armSwingR = -0.3; }
  else if(gesture==="villainous"){ armSwingL = 0.9; armSwingR = -0.9; }
  else if(gesture==="stealthy"){ armSwingL = 0.5; armSwingR = 0.6; }
  else if(gesture==="talk"){ armSwingR = -0.6 + Math.sin(idlePhase*1.5)*0.15; }

  drawLimb(ctx, -14*scale, shoulderY, armLen, 8*scale, armSwingL, app.outfitPrimary);
  drawLimb(ctx, 14*scale, shoulderY, armLen, 8*scale, armSwingR, app.outfitPrimary);

  // Neck
  ctx.fillStyle = shadeColor(app.skin, -10);
  ctx.fillRect(-5*scale, torsoTopY-6*scale, 10*scale, 8*scale);

  // Head — subtle gradient for a little dimensionality
  const headGrad = ctx.createRadialGradient(-4*scale, headCY-4*scale, 1, 0, headCY, headR+2*scale);
  headGrad.addColorStop(0, shadeColor(app.skin, 14));
  headGrad.addColorStop(1, shadeColor(app.skin, -8));
  ctx.beginPath(); ctx.arc(0, headCY, headR, 0, Math.PI*2); ctx.fillStyle = headGrad; ctx.fill();
  ctx.lineWidth=1.4; ctx.strokeStyle=INK; ctx.stroke();

  // Ear — drawn before hair so longer styles can fall naturally over/behind it
  ctx.fillStyle = shadeColor(app.skin, -6);
  ctx.beginPath(); ctx.ellipse(-headR+2.2*scale, headCY+1*scale, 2.3*scale, 3.3*scale, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(app.skin, -26); ctx.lineWidth = 0.8*scale; ctx.stroke();

  // Face — a real eye (white + pupil + lid line), brow, nose bridge, jaw shading, mouth
  ctx.fillStyle = "#f5f1e6";
  ctx.beginPath(); ctx.ellipse(5.6*scale, headCY-2*scale, 2.6*scale, 2*scale, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#1c1c26";
  ctx.beginPath(); ctx.arc(6.1*scale, headCY-2*scale, 1.4*scale, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(app.skin,-30); ctx.lineWidth = 0.9*scale; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(3.2*scale, headCY-3.7*scale); ctx.quadraticCurveTo(6*scale, headCY-4.7*scale, 8.6*scale, headCY-3.3*scale); ctx.stroke();

  ctx.strokeStyle = "#1c1c26"; ctx.lineWidth = 1.2*scale; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(2.4*scale, headCY-6.6*scale); ctx.lineTo(8.6*scale, headCY-5.6*scale); ctx.stroke();

  ctx.strokeStyle = shadeColor(app.skin,-22); ctx.lineWidth = 1*scale;
  ctx.beginPath(); ctx.moveTo(9.5*scale, headCY-2*scale); ctx.lineTo(8.5*scale, headCY+2.5*scale); ctx.stroke();

  ctx.strokeStyle = shadeColor(app.skin,-16); ctx.lineWidth = 0.8*scale;
  ctx.beginPath(); ctx.moveTo(-headR+3*scale, headCY+9*scale); ctx.quadraticCurveTo(2*scale, headCY+13*scale, 10*scale, headCY+8*scale); ctx.stroke();

  const mouthH = talking ? (Math.abs(Math.sin(talkPhase*9))*3.5*scale+1*scale) : 1.4*scale;
  ctx.fillStyle = "#7a3b3b";
  roundRect(ctx, 3*scale, headCY+5*scale, 7*scale, mouthH, 2*scale); ctx.fill();

  // Hair — eight real styles, built from shaded clumps/strands rather than one flat blob,
  // so "short" and "long" read as real hair texture rather than a flat blob.
  const hairBase = app.hairColor;
  const hairHi = shadeColor(app.hairColor, 28);
  ctx.fillStyle = hairBase;
  const style = app.hairStyle;

  if(style==="short"){
    ctx.beginPath(); ctx.arc(0, headCY-1*scale, headR+1.7*scale, Math.PI*0.82, Math.PI*2.18); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.stroke();
    drawHairClump(ctx, -6.5*scale, headCY-headR-0.4*scale, 3*scale, hairBase, hairHi, INK);
    drawHairClump(ctx, 1*scale, headCY-headR-1.6*scale, 3.3*scale, hairBase, hairHi, INK);
    drawHairClump(ctx, 8*scale, headCY-headR-0.3*scale, 2.8*scale, hairBase, hairHi, INK);

  } else if(style==="long"){
    ctx.beginPath(); ctx.arc(0, headCY-1*scale, headR+1.7*scale, Math.PI*0.82, Math.PI*2.18); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle = hairBase;
    ctx.beginPath();
    ctx.moveTo(-headR-1*scale, headCY-3*scale);
    ctx.quadraticCurveTo(-headR-9*scale, headCY+15*scale, -headR-3.5*scale, headCY+34*scale);
    ctx.quadraticCurveTo(-headR+1.5*scale, headCY+20*scale, -headR+3*scale, headCY-2*scale);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.1; ctx.stroke();
    ctx.fillStyle = hairBase;
    ctx.beginPath();
    ctx.moveTo(headR+1*scale, headCY-3*scale);
    ctx.quadraticCurveTo(headR+7.5*scale, headCY+15*scale, headR+2*scale, headCY+34*scale);
    ctx.quadraticCurveTo(headR-3*scale, headCY+20*scale, headR-4*scale, headCY-2*scale);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.1; ctx.stroke();

  } else if(style==="mohawk"){
    for(let i=-1;i<=1;i++){
      const spikeH = (11-Math.abs(i)*3)*scale;
      ctx.beginPath();
      ctx.moveTo(i*3.2*scale-2*scale, headCY-headR);
      ctx.lineTo(i*3.2*scale+2*scale, headCY-headR);
      ctx.lineTo(i*3.2*scale+1.1*scale, headCY-headR-spikeH);
      ctx.lineTo(i*3.2*scale-1.1*scale, headCY-headR-spikeH);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.stroke();
    }
  }
  // "bald" intentionally draws nothing further — the scalp shading on the head fill is enough.

  ctx.restore();
}

function drawLimb(ctx, x, y, len, w, angle, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle*0.5);
  const grad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  grad.addColorStop(0, shadeColor(color, -18));
  grad.addColorStop(0.55, color);
  grad.addColorStop(1, shadeColor(color, -6));
  ctx.fillStyle = grad;
  roundRect(ctx, -w/2, 0, w, len, w/2);
  ctx.fill();
  ctx.lineWidth = Math.max(1, w*0.12);
  ctx.strokeStyle = "rgba(11,11,18,0.5)";
  ctx.stroke();
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* A single shaded "clump" of hair — a small circle with a highlight and an ink outline.
   Several of these overlapping is what gives curly/afro/short hair actual texture instead
   of one flat silhouette shape. */
function drawHairClump(ctx, cx, cy, r, baseColor, hiColor, ink){
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = baseColor; ctx.fill();
  ctx.lineWidth = Math.max(0.8, r*0.14); ctx.strokeStyle = ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx-r*0.32, cy-r*0.32, r*0.36, 0, Math.PI*2);
  ctx.fillStyle = hiColor; ctx.fill();
}

function poseForChoice(c){
  const a = c.align||{};
  const h=a.h||0, v=a.v||0, g=a.g||0;
  if(v>=h && v>=g && v>0) return "villainous";
  if(g>=h && g>=v && g>0) return "stealthy";
  return "heroic";
}

/* ---------- boss fight combat math ----------
   Boss HP always reaches exactly 0 by the fight's final round (so the story always resolves),
   but HOW it gets there — and how much you take back — really does depend on the pose of the
   choice you picked: reckless/villainous trades land harder but cost more, stealthy/evasive
   choices chip away slower but keep you safer, heroic/controlled choices sit in between. */
function bossHpTargetAfterRound(totalRounds, roundIdx){
  if(roundIdx >= totalRounds-1) return 0;
  const remainingFrac = Math.pow(1-(roundIdx+1)/totalRounds, 1.3);
  return Math.round(100*remainingFrac);
}
function poseDamageProfile(pose){
  if(pose==="villainous") return { dealBonus:7, playerLoss:[15,22] };
  if(pose==="stealthy") return { dealBonus:-3, playerLoss:[2,6] };
  return { dealBonus:0, playerLoss:[7,11] }; // heroic / controlled
}
function randRange(a,b){ return Math.round(a + Math.random()*(b-a)); }

/* Plays the hit out visually on whatever cutscene panel is currently open: a shake, a red
   flash, and a floating damage number over the given HP track. */
function triggerHitFX(){
  const ov = document.getElementById("cutOverlay");
  const panel = ov && ov.querySelector(".panel");
  if(!panel) return;
  panel.classList.remove("cut-shake");
  void panel.offsetWidth;
  panel.classList.add("cut-shake");
  panel.style.position = "relative";
  const flash = document.createElement("div");
  flash.className = "hit-flash";
  panel.appendChild(flash);
  setTimeout(()=>{ flash.remove(); }, 460);
}
function spawnDmgFloat(trackId, amount, cls){
  const track = document.getElementById(trackId);
  if(!track || !amount) return;
  const f = document.createElement("div");
  f.className = "dmg-float "+cls;
  f.textContent = "-"+amount;
  track.appendChild(f);
  setTimeout(()=>{ f.remove(); }, 1000);
}

function objectiveText(){
  const step = currentStep();
  if(!step) return "🎯 Head to the Front Doors — the day is done.";
  const room = ROOMS[step.room];
  const e = step.event;
  const name = e.npcName || e.name || e.tag;
  if(step.room==="home") return `🎯 Head home — something's waiting for you tonight.`;
  if(e.npcType==="phone") return `🎯 Check your phone — in the ${room.name}`;
  if(e.npcType==="event") return `🎯 Get to the ${room.name} — ${name} is starting`;
  return `🎯 Find ${name} — in the ${room.name}`;
}

let gcanvas, gctx, keys={}, gRaf=null, camX=0, targetCamX=0, dpr=1;
let player = { walkPhase:0, idlePhase:0, facing:1, moving:false };
let ambientBarkTimer = null, activeBark = null, barkFade = 0;

function renderGameScreen(){
  app.innerHTML = `
    <div id="gameWrap">
      <div id="hud2">
        <div id="chapterLabel">${currentChapter().name}</div>
        <div id="objective">${objectiveText()}</div>
      </div>
      <div id="canvasFrame">
        <canvas id="roomCanvas"></canvas>
        <div id="roomLabel"></div>
        <div id="cutOverlay" class="hidden"></div>
      </div>
      <div id="promptRow"><button id="promptBtn" class="hidden"></button></div>
      <div id="moveRow">
        <button class="movebtn" id="btnLeft">&#9664;</button>
        <div class="hint">arrows / WASD to move &middot; space or the button above to interact</div>
        <button class="movebtn" id="btnRight">&#9654;</button>
      </div>
    </div>`;

  ensureMeterBar();
  gcanvas = document.getElementById("roomCanvas");
  gctx = gcanvas.getContext("2d");
  dpr = Math.min(window.devicePixelRatio||1, 2);
  gcanvas.width = 900*dpr; gcanvas.height = 520*dpr;
  gctx.setTransform(dpr,0,0,dpr,0,0);

  window.onkeydown = e=>{ keys[e.key.toLowerCase()]=true; if(e.key===" "){ e.preventDefault(); handleInteractPress(); } };
  window.onkeyup = e=>{ keys[e.key.toLowerCase()]=false; };
  bindHold("btnLeft","arrowleft"); bindHold("btnRight","arrowright");
  document.getElementById("promptBtn").onclick = handleInteractPress;

  updateRoomLabel();
  if(gRaf) cancelAnimationFrame(gRaf);
  let last = performance.now();
  function loop(ts){
    const dt = Math.min(0.05,(ts-last)/1000); last = ts;
    if(!cutsceneOpen()) updateWorld(dt);
    drawWorld();
    gRaf = requestAnimationFrame(loop);
  }
  gRaf = requestAnimationFrame(loop);
}
function bindHold(id,key){
  const el = document.getElementById(id);
  const down = e=>{ e.preventDefault(); keys[key]=true; };
  const up = e=>{ keys[key]=false; };
  el.addEventListener("pointerdown", down); el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up);
}
function stopGameLoop(){ if(gRaf) cancelAnimationFrame(gRaf); gRaf=null; window.onkeydown=null; window.onkeyup=null; }

function cutsceneOpen(){
  const ov = document.getElementById("cutOverlay");
  return ov && !ov.classList.contains("hidden");
}

function room(){ return ROOMS[S.room]; }

function updateRoomLabel(){
  const lbl = document.getElementById("roomLabel");
  if(lbl) lbl.textContent = room().name;
  const obj = document.getElementById("objective");
  if(obj) obj.textContent = objectiveText();
}

function updateWorld(dt){
  let dx = 0;
  if(keys["arrowleft"]||keys["a"]) dx -= 1;
  if(keys["arrowright"]||keys["d"]) dx += 1;
  player.moving = dx!==0;
  if(dx!==0) player.facing = dx;
  const SPEED = 220;
  if(dx!==0){
    S.playerX = Math.max(20, Math.min(room().width-20, S.playerX + dx*SPEED*dt));
    player.walkPhase += dt*9;
  }
  player.idlePhase += dt*1.6;

  if(room().kind==="hallway"){
    targetCamX = Math.max(0, Math.min(room().width-900, S.playerX-450));
  } else targetCamX = 0;

  // Smooth Camera Easing
  camX += (targetCamX - camX) * 0.12;

  updatePrompt();
}

function nearestInteractable(){
  const r = room();
  let best = null, bestD = 46;
  r.doors.forEach(d=>{
    const dist = Math.abs(S.playerX-d.x);
    if(dist<bestD){ bestD=dist; best={type:"door", data:d}; }
  });
  const step = currentStep();
  if(step && step.room===S.room){
    const fx = flaggedX();
    const dist = Math.abs(S.playerX-fx);
    if(dist<50 && dist<bestD){ bestD=dist; best={type:"event", data:step}; }
  }
  (AMBIENT_NPCS[S.room]||[]).forEach(n=>{
    const dist = Math.abs(S.playerX-n.x);
    if(dist<50 && dist<bestD){ bestD=dist; best={type:"ambient", data:n}; }
  });
  return best;
}
const FLAGGED_X = { hallway:750, classroom:700, gym:700, library:700, cafeteria:700, courtyard:700, home:750 };
function flaggedX(){
  return FLAGGED_X[S.room] || 700;
}
function updatePrompt(){
  const btn = document.getElementById("promptBtn");
  if(!btn) return;
  const t = nearestInteractable();
  if(!t){ btn.classList.add("hidden"); return; }
  btn.classList.remove("hidden");
  if(t.type==="door") btn.textContent = (t.data.leadsTo==="home"?"Leave School — ":"Enter ")+t.data.label.replace("Front Doors (Go Home)","Home").replace("Head Back to School","School");
  else if(t.type==="event"){
    const e = t.data.event;
    const label = e.npcName||e.name||e.tag;
    const verb = e.npcType==="phone" ? "Check " : e.npcType==="event" ? "Head to " : "Talk to ";
    btn.textContent = verb+label;
  }
  else btn.textContent = "Talk to "+t.data.name;
}
function handleInteractPress(){
  if(cutsceneOpen()) return;
  const t = nearestInteractable();
  if(!t) return;
  if(t.type==="door") enterRoom(t.data.leadsTo);
  else if(t.type==="event") beginStepEvent(t.data);
  else if(t.type==="ambient") showBark(t.data);
}
function enterRoom(roomId){
  if(roomId==="hallway"){
    S.playerX = HALLWAY_DOOR_X[S.room] || 800;
  } else {
    S.playerX = 140;
  }
  S.room = roomId;
  updateRoomLabel();
}
/* Picks which line an ambient NPC says based on how far your meter has actually moved from
   its starting 10/10/10 tie — a small early lean doesn't change what people say yet, but a
   real, sustained one does. */
function showBark(npc){
  let text = npc.bark;
  if(npc.barkVariants){
    const lead = leadingTrait();
    const leadValue = S[lead];
    const moved = leadValue - 10 >= 6; // meaningful, sustained lean — not just one choice
    text = moved ? (npc.barkVariants[lead] || npc.barkVariants.neutral) : npc.barkVariants.neutral;
  }
  activeBark = { name:npc.name, text };
  barkFade = 3.2;
}

/* ---------- drawing the world ---------- */
function drawWorld(){
  const ctx = gctx, kind = room().kind;
  ctx.clearRect(0,0,900,520);
  drawRoomBackground(ctx, kind);
  drawDoors(ctx);
  drawAmbientNpcs(ctx);
  drawFlaggedNpc(ctx);
  drawPlayer(ctx);
  drawBarkBubble(ctx);
}
function toScreen(x){ return x - camX; }

function drawRoomBackground(ctx, kind){
  ctx.fillStyle = "#d8cfb4"; ctx.fillRect(0,0,900,520);

  // Floor — gradient instead of flat fill, for a little depth
  const floorBase = kind==="gym"?"#c98a4b":kind==="courtyard"?"#8fae6e":"#e3d9bd";
  const floorGrad = ctx.createLinearGradient(0,360,0,520);
  floorGrad.addColorStop(0, shadeColor(floorBase, 10));
  floorGrad.addColorStop(1, shadeColor(floorBase, -12));
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0,360,900,160);
  ctx.strokeStyle = "rgba(0,0,0,0.08)"; ctx.lineWidth=2;
  for(let x=-camX%80; x<900; x+=80){ ctx.beginPath(); ctx.moveTo(x,360); ctx.lineTo(x,520); ctx.stroke(); }
  // Thin sheen where floor meets wall
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(0,358,900,4);

  // Wall band gradient & soft overhead light pools
  const wallGrad = ctx.createLinearGradient(0,0,0,360);
  if(kind==="courtyard"){ wallGrad.addColorStop(0,"#4e7fa8"); wallGrad.addColorStop(0.7,"#6f97bf"); wallGrad.addColorStop(1,"#8fb0d4"); }
  else { wallGrad.addColorStop(0,"#9e926d"); wallGrad.addColorStop(1,"#beaf86"); }
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0,0,900,360);
  if(kind!=="courtyard"){
    for(let lx=90; lx<900; lx+=220){
      const lg = ctx.createRadialGradient(lx,0,4,lx,40,150);
      lg.addColorStop(0,"rgba(255,247,220,0.22)");
      lg.addColorStop(1,"rgba(255,247,220,0)");
      ctx.fillStyle = lg;
      ctx.fillRect(lx-150,0,300,220);
    }
  }
  ctx.fillStyle = "rgba(0,0,0,0.06)";
  ctx.fillRect(0,340,900,20);

  const width = room().width;
  if(kind==="hallway"){
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    for(let x=-camX; x<width-camX; x+=180){ roundRect(ctx,x+40,120,90,220,4); ctx.fill(); }
    for(let x=-camX; x<width-camX; x+=180){
      const lg = ctx.createLinearGradient(x+40,120,x+130,340);
      lg.addColorStop(0, "#9a8e6d"); lg.addColorStop(1, "#7d7255");
      ctx.fillStyle = lg;
      ctx.fillRect(x+40,120,90,220);
      ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.lineWidth=2; ctx.strokeRect(x+40,120,90,220);
      for(let i=1;i<5;i++){
        ctx.strokeStyle="rgba(0,0,0,0.15)";
        ctx.beginPath(); ctx.moveTo(x+40+i*18,120); ctx.lineTo(x+40+i*18,340); ctx.stroke();
        ctx.fillStyle="#c9a24a";
        ctx.beginPath(); ctx.arc(x+40+i*18-9,230,1.6,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.fillStyle = "#f2ede1"; ctx.font="bold 13px Oswald, sans-serif"; ctx.textAlign="center";
    ctx.fillText("MAIN HALL", 450, 60);
  } else if(kind==="classroom"){
    for(let r2=0;r2<3;r2++) for(let c2=0;c2<4;c2++){
      const dx=260+c2*130, dy=200+r2*55;
      const dg = ctx.createLinearGradient(dx,dy,dx+60,dy+26);
      dg.addColorStop(0,"#6a5646"); dg.addColorStop(1,"#4a3a2e");
      ctx.fillStyle = dg;
      ctx.fillRect(dx,dy,60,26); ctx.fillRect(dx+22,dy+26,16,20);
      ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1; ctx.strokeRect(dx,dy,60,26);
    }
    const boardGrad = ctx.createLinearGradient(80,60,320,210);
    boardGrad.addColorStop(0,"#3f4d3f"); boardGrad.addColorStop(1,"#2c382c");
    ctx.fillStyle = boardGrad; ctx.fillRect(80,60,240,150);
    ctx.strokeStyle="#f2ede1"; ctx.lineWidth=6; ctx.strokeRect(80,60,240,150);
    ctx.strokeStyle="rgba(242,237,225,0.55)"; ctx.lineWidth=2; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(105,95); ctx.lineTo(190,95); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(105,120); ctx.lineTo(260,120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(105,145); ctx.lineTo(220,145); ctx.stroke();
  } else if(kind==="gym"){
    ctx.fillStyle="rgba(0,0,0,0.18)";
    for(let i=0;i<4;i++){ ctx.fillRect(50, 130+i*24, 800, 10); }
    ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.lineWidth=3;
    ctx.strokeRect(60,380,780,90);
    ctx.beginPath(); ctx.moveTo(450,380); ctx.lineTo(450,470); ctx.stroke();
    ctx.beginPath(); ctx.arc(450,425,40,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle="#5a4636"; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(110,120); ctx.lineTo(110,190); ctx.stroke();
    ctx.strokeStyle="#c1272d"; ctx.beginPath(); ctx.arc(110,195,22,Math.PI,Math.PI*2); ctx.stroke();
    // scoreboard
    ctx.fillStyle="#14141f"; roundRect(ctx,760,90,110,50,4); ctx.fill();
    ctx.strokeStyle="#f5c542"; ctx.lineWidth=2; roundRect(ctx,760,90,110,50,4); ctx.stroke();
    ctx.fillStyle="#e8757c"; ctx.font="bold 16px 'Bangers', cursive"; ctx.textAlign="center";
    ctx.fillText("HOME 00", 815, 120);
    if(S.graduationMode){
      const t = performance.now()/500;
      for(let i=0;i<10;i++){ ctx.fillStyle=["#f5c542","#c1272d","#2f5fb3","#7b5ea7"][i%4]; ctx.fillRect(70+i*82, 40+Math.sin(t+i)*8, 6, 40); }
      ctx.fillStyle="#f2ede1"; ctx.font="bold 20px Bangers, cursive"; ctx.textAlign="center"; ctx.fillText("GRADUATION NIGHT", 450, 90);
    } else {
      ctx.fillStyle="#f2ede1"; ctx.font="bold 13px Oswald, sans-serif"; ctx.textAlign="center"; ctx.fillText("GYMNASIUM", 450, 60);
    }
  } else if(kind==="library"){
    for(let i=0;i<5;i++){
      const sg = ctx.createLinearGradient(90+i*150,90,90+i*150+120,310);
      sg.addColorStop(0,"#6a5646"); sg.addColorStop(1,"#453729");
      ctx.fillStyle = sg;
      ctx.fillRect(90+i*150,90,120,220);
      ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=1; ctx.strokeRect(90+i*150,90,120,220);
    }
    const bookColors = ["#c1272d","#2f5fb3","#7b5ea7","#1f8a4c","#e0a318","#1e8a8a"];
    let bc = 0;
    for(let i=0;i<5;i++) for(let s2=0;s2<6;s2++){
      const bx = 96+i*150, by = 96+s2*34;
      let cursor = 0;
      while(cursor < 108){
        const bw = 6 + (bc%4)*3;
        ctx.fillStyle = bookColors[bc%bookColors.length];
        ctx.fillRect(bx+cursor, by, Math.min(bw,108-cursor), 26);
        cursor += bw+1; bc++;
      }
    }
    ctx.fillStyle="#f2ede1"; ctx.font="bold 13px Oswald, sans-serif"; ctx.textAlign="center"; ctx.fillText("LIBRARY", 450, 60);
  } else if(kind==="cafeteria"){
    for(let i=0;i<4;i++){
      const tx=150+i*160, ty=220;

function drawFlaggedNpc(ctx){

  const e = step.event;

  ctx.fillStyle="#f5c542"; ctx.font="bold 26px Bangers, cursive"; ctx.textAlign="center";

/* A phone buzzing on a locker/desk — not a person, so it never gets a human figure. */
function drawPhoneProp(ctx, sx, groundY, pulse){
  ctx.save();
  ctx.translate(sx, groundY-8);
  ctx.fillStyle="rgba(10,10,16,0.35)";

/* A pulsing marker for a story beat that isn't a person (e.g. prom/graduation night). */
function drawEventBeacon(ctx, sx, groundY, pulse){
