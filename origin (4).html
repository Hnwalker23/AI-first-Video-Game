const NPC_LOOKS = {};
/* Fixed: the hash previously used signed right-shift (>>), which for large hash values could
   go negative and produce an out-of-range (undefined) array index — silently breaking a
   specific NPC's colors depending on their name. Unsigned shift (>>>) guarantees a valid
   non-negative index every time. */
function npcAppearance(name){
  if(!NPC_LOOKS[name]){
    let h=0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    NPC_LOOKS[name] = {
      skin: SKIN_TONES[h%SKIN_TONES.length],
      hairColor: HAIR_COLORS[(h>>>3)%HAIR_COLORS.length],
      hairStyle: HAIR_STYLES[(h>>>5)%HAIR_STYLES.length],
      outfitPrimary: OUTFIT_COLORS[(h>>>7)%OUTFIT_COLORS.length],
      outfitAccent: ACCENT_COLORS[(h>>>9)%ACCENT_COLORS.length]
    };
  }
  return NPC_LOOKS[name];
}

/* ============================================================
   CUTSCENE / DIALOGUE SYSTEM
   ============================================================ */

function beginStepEvent(step){
  const e = step.event;
  if(e.rounds){ startBossCutscene(e); return; }
  startEventCutscene(e, step);
}

function openCut(html){
  const ov = document.getElementById("cutOverlay");
  ov.innerHTML = `<div class="panel">${html}</div>`;
  ov.classList.remove("hidden");
}
function closeCut(){
  const ov = document.getElementById("cutOverlay");
  ov.classList.add("hidden");
  ov.innerHTML = "";
}

function typewriter(el, text, speed, onDone){
  let i = 0;
  el.textContent = "";
  el.dataset.full = text;
  el.dataset.done = "0";
  const iv = setInterval(()=>{
    i++;
    el.textContent = text.slice(0,i);
    if(i>=text.length){ clearInterval(iv); el.dataset.done="1"; if(onDone) onDone(); }
  }, speed||16);
  el._skip = ()=>{ clearInterval(iv); el.textContent=text; el.dataset.done="1"; if(onDone) onDone(); };
}

function startEventCutscene(e, step){
  const npcName = e.npcName || e.tag;
  openCut(`
    <div class="chapter-tag">${e.tag}</div>
    <div class="stage-row">
      <div class="stage-portrait"><canvas id="pcPortrait" width="200" height="260"></canvas><div class="who">${S.name||"You"}</div></div>
      <div class="stage-portrait"><canvas id="npcPortrait" width="200" height="260"></canvas><div class="who">${npcName}</div></div>
    </div>
    <p class="dialogue-box" id="dlgText"></p>
    <div class="choices" id="choiceWrap"></div>
  `);
  const pc = document.getElementById("pcPortrait").getContext("2d");
  const nc = document.getElementById("npcPortrait").getContext("2d");
  const type = e.npcType || "person";
  let t0 = performance.now();
  const anim = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    paintPortrait(pc, S.appearance, true, t);
    if(type==="phone") paintPhonePortrait(nc, t);
    else if(type==="event") paintEventPortrait(nc, t);
    else paintPortrait(nc, npcAppearance(npcName), false, t);
  }, 60);

  const dlg = document.getElementById("dlgText");
  const wrap = document.getElementById("choiceWrap");
  const resolvedText = e.text.includes("{{ORIGIN}}")
    ? e.text.replace("{{ORIGIN}}", ORIGIN_MANIFESTATIONS[S.locationId] || ORIGIN_MANIFESTATIONS.urban)
    : e.text;
  typewriter(dlg, resolvedText, 15, ()=>{
    e.choices.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = c.label;
      b.onclick = ()=>{ clearInterval(anim); resolveChoice(e, c, step); };
      wrap.appendChild(b);
    });
  });
  dlg.onclick = ()=>{ if(dlg.dataset.done!=="1") dlg._skip(); };
}

function paintPortrait(ctx, appear, talking, t){
  ctx.clearRect(0,0,200,260);
  const g = ctx.createLinearGradient(0,0,0,260);
  g.addColorStop(0,"#3a4a68"); g.addColorStop(1,"#22283a");
  ctx.fillStyle = g; ctx.fillRect(0,0,200,260);
  drawHuman(ctx, 100, 235, 1.7, appear, {facing:1, idlePhase:t*1.6, talking, talkPhase:t*6, gesture: talking?"talk":"idle"});
}
/* Used instead of paintPortrait whenever the "other side" of a scene is a phone, not a person. */
function paintPhonePortrait(ctx, t){
  ctx.clearRect(0,0,200,260);
  const g = ctx.createLinearGradient(0,0,0,260);
  g.addColorStop(0,"#3a4a68"); g.addColorStop(1,"#22283a");
  ctx.fillStyle = g; ctx.fillRect(0,0,200,260);
  const pulse = 0.5+0.5*Math.sin(t*4);
  ctx.save();
  ctx.translate(100,140);
  ctx.shadowColor="#7ea1e8"; ctx.shadowBlur=20+pulse*10;
  ctx.fillStyle="#14141f";
  roundRect(ctx,-42,-78,84,156,14); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#7ea1e8";
  ctx.globalAlpha = 0.6+pulse*0.35;
  roundRect(ctx,-34,-68,68,118,6); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle="#14141f";
  ctx.beginPath(); ctx.arc(0,60,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(11,11,18,0.85)";
  roundRect(ctx,-30,-58,60,20,4); ctx.fill();
  ctx.fillStyle="#f5c542"; ctx.font="bold 10px Oswald, sans-serif"; ctx.textAlign="center";
  ctx.fillText("ALERT", 0, -44);
  ctx.restore();
}
/* Used instead of paintPortrait whenever the "other side" of a scene is an event, not a person. */
function paintEventPortrait(ctx, t){
  ctx.clearRect(0,0,200,260);
  const g = ctx.createLinearGradient(0,0,0,260);
  g.addColorStop(0,"#3a2a4a"); g.addColorStop(1,"#22283a");
  ctx.fillStyle = g; ctx.fillRect(0,0,200,260);
  const pulse = 0.5+0.5*Math.sin(t*3);
  for(let i=0;i<3;i++){
    ctx.fillStyle = ["#f5c542","#c1272d","#2f5fb3"][i];
    ctx.globalAlpha = 0.55+0.3*Math.sin(t*3+i);
    ctx.fillRect(52+i*44, 50+Math.sin(t*2+i)*10, 9, 70);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle="#f2ede1"; ctx.font="bold 15px Bangers, cursive"; ctx.textAlign="center";
  ctx.fillText("GRADUATION NIGHT", 100, 200+pulse*2);
}

function resolveChoice(e, c, step){
  applyAlign(c.align);
  const pose = poseForChoice(c);
  let grantedPower = null;
  if(e.grantsPower){
    const pid = e.originPower
      ? ORIGIN_POWER_BY_LOCATION[S.locationId]
      : pickPowerByFlavor(S.locationId, pose==="villainous"?"villain":pose==="stealthy"?"vigilante":"hero", S.powers);
    S.powers.push(pid);
    grantedPower = POWERS[pid];
  }
  S.log.push({chapter:currentChapter().name, tag:e.tag, choice:c.label, align:c.align});
  openCut(`
    <div class="chapter-tag">${e.tag}</div>
    <div class="cut-solo"><canvas id="soloPortrait" width="300" height="380"></canvas></div>
    <p class="flavor" id="resultText"></p>
    ${grantedPower ? `<ul class="powerlist"><li><div class="pname">⚡ Power Awakened: ${grantedPower.name}</div><div class="pdesc">${grantedPower.desc}</div></li></ul>` : ""}
    <button class="primary" id="contBtn" disabled>Continue</button>
  `);
  const sc = document.getElementById("soloPortrait").getContext("2d");
  let t0 = performance.now();
  const anim = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    sc.clearRect(0,0,300,380);
    const g = sc.createLinearGradient(0,0,0,380);
    g.addColorStop(0, pose==="villainous"?"#5a2020":pose==="stealthy"?"#2a2a3a":"#20365a");
    g.addColorStop(1,"#14141f");
    sc.fillStyle = g; sc.fillRect(0,0,300,380);
    drawHuman(sc, 150, 340, 2.5, S.appearance, {facing:1, idlePhase:t*1.2, gesture:pose});
  }, 60);
  const rt = document.getElementById("resultText");
  typewriter(rt, c.result, 16, ()=>{ document.getElementById("contBtn").disabled=false; });
  rt.onclick = ()=>{ if(rt.dataset.done!=="1") rt._skip(); };
  document.getElementById("contBtn").onclick = ()=>{
    clearInterval(anim);
    closeCut();
    if(c.sideScene && SIDE_SCENES[c.sideScene]){
      playSideScene(SIDE_SCENES[c.sideScene], ()=>advanceStep(step));
    } else {
      advanceStep(step);
    }
  };
}

/* Plays a bonus follow-up scene triggered by a specific earlier choice. Structurally it's
   just like a single event cutscene (portraits, dialogue, choices, a result beat) but it
   isn't tied to any room or chapter step — it just happens, then hands control back via
   onDone() so the main story continues exactly where it left off. */
function playSideScene(scene, onDone){
  const npcName = scene.npcName || scene.tag;
  openCut(`
    <div class="chapter-tag">${scene.tag}</div>
    <div class="stage-row">
      <div class="stage-portrait"><canvas id="pcPortraitSide" width="200" height="260"></canvas><div class="who">${S.name||"You"}</div></div>
      <div class="stage-portrait"><canvas id="npcPortraitSide" width="200" height="260"></canvas><div class="who">${npcName}</div></div>
    </div>
    <p class="dialogue-box" id="dlgTextSide"></p>
    <div class="choices" id="choiceWrapSide"></div>
  `);
  const pc = document.getElementById("pcPortraitSide").getContext("2d");
  const nc = document.getElementById("npcPortraitSide").getContext("2d");
  let t0 = performance.now();
  const anim = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    paintPortrait(pc, S.appearance, true, t);
    paintPortrait(nc, npcAppearance(npcName), false, t);
  }, 60);
  const dlg = document.getElementById("dlgTextSide");
  const wrap = document.getElementById("choiceWrapSide");
  typewriter(dlg, scene.text, 15, ()=>{
    scene.choices.forEach(c=>{
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = c.label;
      b.onclick = ()=>{ clearInterval(anim); resolveSideChoice(scene, c, onDone); };
      wrap.appendChild(b);
    });
  });
  dlg.onclick = ()=>{ if(dlg.dataset.done!=="1") dlg._skip(); };
}
function resolveSideChoice(scene, c, onDone){
  applyAlign(c.align);
  S.log.push({chapter:currentChapter().name, tag:scene.tag, choice:c.label, align:c.align});
  const pose = poseForChoice(c);
  openCut(`
    <div class="chapter-tag">${scene.tag}</div>
    <div class="cut-solo"><canvas id="soloPortraitSide" width="300" height="380"></canvas></div>
    <p class="flavor" id="resultTextSide"></p>
    <button class="primary" id="contBtnSide" disabled>Continue</button>
  `);
  const sc = document.getElementById("soloPortraitSide").getContext("2d");
  let t0 = performance.now();
  const anim = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    sc.clearRect(0,0,300,380);
    const g = sc.createLinearGradient(0,0,0,380);
    g.addColorStop(0, pose==="villainous"?"#5a2020":pose==="stealthy"?"#2a2a3a":"#20365a");
    g.addColorStop(1,"#14141f");
    sc.fillStyle = g; sc.fillRect(0,0,300,380);
    drawHuman(sc, 150, 340, 2.5, S.appearance, {facing:1, idlePhase:t*1.2, gesture:pose});
  }, 60);
  const rt = document.getElementById("resultTextSide");
  typewriter(rt, c.result, 16, ()=>{ document.getElementById("contBtnSide").disabled=false; });
  rt.onclick = ()=>{ if(rt.dataset.done!=="1") rt._skip(); };
  document.getElementById("contBtnSide").onclick = ()=>{
    clearInterval(anim);
    closeCut();
    onDone();
  };
}

function advanceStep(step){
  S.stepIndex++;
  if(S.stepIndex >= currentChapter().steps.length){
    S.chapterIndex++;
    S.stepIndex = 0;
    if(S.chapterIndex >= CHAPTERS.length){ renderAliasCreator(); return; }
    stopGameLoop();
    renderChapterIntro();
    return;
  }
  updateRoomLabel();
}

/* ---------- boss / fight (multi-round) ---------- */
/* Replaces any {{POWER}} token in boss-round text with the name of your most recently
   unlocked power (falling back to a generic phrase if you somehow have none yet) — so combat
   choices can reference the actual ability you're playing as, not a generic placeholder. */
function resolvePowerToken(text){
  if(!text || !text.includes("{{POWER}}")) return text;
  const name = S.powers.length ? POWERS[S.powers[S.powers.length-1]].name : "your instincts";
  return text.replace(/\{\{POWER\}\}/g, name);
}

function startBossCutscene(boss){
  boss._round = boss._round || 0;
  const step = currentStep();
  if(boss.name==="Graduation Night") S.graduationMode = true;
  openCut(`
    <div class="chapter-tag">Confrontation</div>
    <h2 class="subtitle">${boss.name}</h2>
    <div class="cut-solo"><canvas id="soloPortrait" width="300" height="380"></canvas></div>
    <p id="dlgText"></p>
    <button class="primary" id="faceBtn" disabled>Face It</button>
  `);
  paintSoloIdle();
  const dlg = document.getElementById("dlgText");
  typewriter(dlg, boss.intro, 15, ()=>{ document.getElementById("faceBtn").disabled=false; });
  dlg.onclick = ()=>{ if(dlg.dataset.done!=="1") dlg._skip(); };
  document.getElementById("faceBtn").onclick = ()=>renderBossRound(boss, step);
}
let soloAnimTimer = null;
function paintSoloIdle(){
  const el = document.getElementById("soloPortrait");
  if(!el) return;
  const sc = el.getContext("2d");
  let t0 = performance.now();
  clearInterval(soloAnimTimer);
  soloAnimTimer = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    sc.clearRect(0,0,300,380);
    const g = sc.createLinearGradient(0,0,0,380);
    g.addColorStop(0,"#20365a"); g.addColorStop(1,"#14141f");
    sc.fillStyle = g; sc.fillRect(0,0,300,380);
    drawHuman(sc, 150, 340, 2.5, S.appearance, {facing:1, idlePhase:t*1.2, gesture:"idle"});
  }, 60);
}
function renderBossRound(boss, step){
  if(boss._round >= boss.rounds.length){
    S.graduationMode = false;
    boss._round = 0;
    boss._bossHP = undefined;
    boss._playerHP = undefined;
    clearInterval(soloAnimTimer);
    closeCut();
    advanceStep(step);
    return;
  }
  const round = boss.rounds[boss._round];
  const isCombat = !round.noCombat;
  if(isCombat){
    if(boss._bossHP===undefined){
      boss._bossHP = 100; boss._playerHP = 100;
    } else if(boss._round>0){
      boss._playerHP = Math.min(100, boss._playerHP + 6); // a little recovery going into the next exchange
    }
  }
  // The HP bar names the actual opponent you're fighting (boss.opponentName) rather than the
  // scene's title (boss.name) — "Graduation Night" is the night this happens on, not who you
  // fight. Non-combat rounds (evacuating people, etc.) show no HP bars at all: nobody's being
  // hit yet, so nothing should read like a hit landed.
  const opponentLabel = boss.opponentName || boss.name;
  const hpHTML = isCombat ? `
    <div class="hp-row"><div class="hp-label">${opponentLabel}</div><div class="hp-track" id="bossHpTrack"><div class="hp-fill boss" id="bossHpFill" style="width:${boss._bossHP}%"></div></div></div>
    <div class="hp-row"><div class="hp-label">You</div><div class="hp-track" id="playerHpTrack"><div class="hp-fill player" id="playerHpFill" style="width:${boss._playerHP}%"></div></div></div>
  ` : "";
  openCut(`
    <div class="chapter-tag">${boss.name}</div>
    ${hpHTML}
    <p class="dialogue-box" id="dlgText2"></p>
    <div class="choices" id="choiceWrap2"></div>
  `);
  const dlg = document.getElementById("dlgText2");
  const wrap = document.getElementById("choiceWrap2");
  typewriter(dlg, resolvePowerToken(round.text), 15, ()=>{
    round.choices.forEach(c=>{
      const b = document.createElement("button");
      b.className="choice"; b.textContent=resolvePowerToken(c.label);
      b.onclick = ()=>resolveBossChoice(boss, round, c, step);
      wrap.appendChild(b);
    });
  });
  dlg.onclick = ()=>{ if(dlg.dataset.done!=="1") dlg._skip(); };
}
function resolveBossChoice(boss, round, c, step){
  const isCombat = !round.noCombat;
  const pose = poseForChoice(c);

  if(!isCombat){
    // A non-combat round (e.g. getting people to safety before any fight starts): the choice
    // still shapes your meter and gets logged, but there's no opponent HP to move and no hit
    // to fake — nothing here pretends a fight is already happening.
    applyAlign(c.align);
    S.log.push({chapter:currentChapter().name, tag:boss.name, choice:c.label, align:c.align});
    boss._round++;
    showBossResultScreen(boss, step, c, pose, null);
    return;
  }

  const profile = poseDamageProfile(pose);
  const totalRounds = boss.rounds.length;
  const roundIdx = boss._round;
  const target = bossHpTargetAfterRound(totalRounds, roundIdx);
  const dealt = Math.min(boss._bossHP, Math.max(4, (boss._bossHP - target) + profile.dealBonus));
  const bossHpBefore = boss._bossHP;
  boss._bossHP = Math.max(0, boss._bossHP - dealt);
  const dealtDisplay = bossHpBefore - boss._bossHP;
  const playerLoss = randRange(profile.playerLoss[0], profile.playerLoss[1]);
  boss._playerHP = Math.max(15, boss._playerHP - playerLoss);

  // Play the hit out on the round screen that's already on-screen before switching views —
  // this is the actual "combat payoff": real HP dropping, a shake, a flash, damage numbers.
  const bossFill = document.getElementById("bossHpFill");
  const playerFill = document.getElementById("playerHpFill");
  if(bossFill) bossFill.style.width = boss._bossHP+"%";
  if(playerFill) playerFill.style.width = boss._playerHP+"%";
  spawnDmgFloat("bossHpTrack", dealtDisplay, "boss");
  spawnDmgFloat("playerHpTrack", playerLoss, "player");
  triggerHitFX();
  document.querySelectorAll("#choiceWrap2 .choice").forEach(b=>{ b.disabled = true; });

  setTimeout(()=>{
    applyAlign(c.align);
    S.log.push({chapter:currentChapter().name, tag:boss.name, choice:c.label, align:c.align});
    let grantedPower = null;
    if(boss.grantsPower && boss._round===0){
      const pid = pickPowerByFlavor(S.locationId, pose==="villainous"?"villain":pose==="stealthy"?"vigilante":"hero", S.powers);
      S.powers.push(pid);
      grantedPower = POWERS[pid];
    }
    boss._round++;
    showBossResultScreen(boss, step, c, pose, grantedPower);
  }, 650);
}
/* Shared "aftermath" screen for a boss round — your reaction pose, the result text, and any
   power granted. Used by both combat and non-combat rounds so the flow feels identical either
   way even though only one of them actually moved an HP bar. */
function showBossResultScreen(boss, step, c, pose, grantedPower){
  openCut(`
    <div class="chapter-tag">${boss.name}</div>
    <div class="cut-solo"><canvas id="soloPortrait" width="300" height="380"></canvas></div>
    <p class="flavor" id="resultText2"></p>
    ${grantedPower ? `<ul class="powerlist"><li><div class="pname">⚡ Power Surge: ${grantedPower.name}</div><div class="pdesc">${grantedPower.desc}</div></li></ul>` : ""}
    <button class="primary" id="contBtn2" disabled>Continue</button>
  `);
  const sc = document.getElementById("soloPortrait").getContext("2d");
  let t0 = performance.now();
  clearInterval(soloAnimTimer);
  soloAnimTimer = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    sc.clearRect(0,0,300,380);
    const g = sc.createLinearGradient(0,0,0,380);
    g.addColorStop(0, pose==="villainous"?"#5a2020":pose==="stealthy"?"#2a2a3a":"#20365a");
    g.addColorStop(1,"#14141f");
    sc.fillStyle = g; sc.fillRect(0,0,300,380);
    drawHuman(sc, 150, 340, 2.5, S.appearance, {facing:1, idlePhase:t*1.2, gesture:pose});
  }, 60);
  const rt = document.getElementById("resultText2");
  typewriter(rt, c.result, 16, ()=>{ document.getElementById("contBtn2").disabled=false; });
  rt.onclick = ()=>{ if(rt.dataset.done!=="1") rt._skip(); };
  document.getElementById("contBtn2").onclick = ()=>renderBossRound(boss, step);
}

/* ============================================================
   FINALE
   ============================================================ */
function getTitleInfo(){
  const p = pcts();
  const entries = [
    {key:"hero", val:p.hero, cls:"hero", name:"HERO"},
    {key:"villain", val:p.villain, cls:"villain", name:"VILLAIN"},
    {key:"vigilante", val:p.vigilante, cls:"vigilante", name:"VIGILANTE"}
  ];
  entries.sort((a,b)=>b.val-a.val);
  const top = entries[0];
  let prefix = "";
  if(top.val>=70) prefix="TRUE ";
  else if(top.val<45) prefix="WAVERING ";
  return { title: prefix+top.name, cls: top.cls, pct: top.val };
}
function locName(){ return LOCATIONS.find(l=>l.id===S.locationId).name; }

/* Finds whichever single choice pushed hardest toward your final ending, so the finale can
   call back to something you specifically chose rather than speaking only in generalities. */
function mostDefiningChoice(cls){
  const key = cls==="hero" ? "h" : cls==="villain" ? "v" : "g";
  let best = null, bestVal = 0;
  S.log.forEach(entry=>{
    const val = (entry.align && entry.align[key]) || 0;
    if(val > bestVal){ bestVal = val; best = entry; }
  });
  return best;
}
function lowerFirst(s){ return s ? s.charAt(0).toLowerCase()+s.slice(1) : s; }

/* The whole game speaks to "you" in second person — the ending does the same, instead of
   switching to third-person ("he"/"she"/S.name") like it used to. The one name revealed here
   is the alias chosen in renderAliasCreator(), collected only after the story is fully over
   so it fits however the run actually turned out. */
function buildOriginStory(info){
  const powerNames = S.powers.map(id=>POWERS[id].name);
  const powerText = powerNames.length ? powerNames.join(", ") : "abilities still not fully understood";
  const bigMoments = S.log.filter(l=>l.tag===JUNIOR_BOSS.name || l.tag===FINAL_BOSS.name);
  const firstBig = bigMoments[0];
  let arc = "";
  if(info.cls==="hero") arc = `By graduation, there was no question left. You'd spent four years choosing, again and again, to put other people first — until it stopped being a choice and started being who you were.`;
  else if(info.cls==="villain") arc = `By graduation, you'd stopped pretending otherwise. Every shortcut, every score settled, every line crossed had led here — and you walked toward it without flinching.`;
  else arc = `By graduation, you'd learned to work in the space between the rules — never quite hero, never quite villain, just the person who showed up when no one else could, and vanished before anyone could ask questions.`;
  const turningPoint = firstBig ? ` The turning point came the night your path crossed The Recruiter's — a choice you still think about.` : "";
  const defining = mostDefiningChoice(info.cls);
  const definingLine = defining ? ` If one moment sums up how you got here, it's "${defining.tag}" — the day you chose to ${lowerFirst(defining.choice).replace(/\.$/,"")}.` : "";
  return `You grew up in ${locName()}, an ordinary student until freshman-year instincts and a gym-class accident said otherwise. What emerged was ${powerText}. ${arc}${turningPoint}${definingLine} Today you graduate — not just from high school, but into whatever comes next. ${S.name} walks out these doors one last time, but the name people will remember is ${S.aliasName}: ${info.title.toLowerCase()}, ${info.pct}% certain, and still writing the rest of the story.`;
}

/* Runs once, after the very last choice of the game (win, lose, or anywhere in between) and
   before the verdict is revealed — so naming your alias always happens at the end, and always
   happens no matter which of the three endings you landed on. */
function renderAliasCreator(){
  stopGameLoop();
  window.onkeydown=null; window.onkeyup=null;
  hideMeterBar();
  const info = getTitleInfo();
  app.innerHTML = `
    <div class="panel" style="text-align:center;">
      <div class="chapter-tag">Graduation Night</div>
      <h2 class="subtitle">One Last Thing</h2>
      <p>Whatever you've become, people are going to need something to call you. This is the name that goes down in the story — pick it now.</p>
      <div class="stamp-wrap"><div class="stamp ${info.cls}" style="animation:none; transform:rotate(-6deg) scale(1);">${info.title}<span class="sub">${info.pct}% CERTAIN</span></div></div>
      <fieldset style="text-align:left; max-width:360px; margin:0 auto;">
        <legend>Your Name</legend>
        <input type="text" id="aliasInput" placeholder="e.g. Nightglass, The Warden, Ivy Cole..." maxlength="24">
      </fieldset>
      <button class="primary" id="aliasBtn" disabled style="max-width:360px; margin-left:auto; margin-right:auto;">Seal the Story</button>
    </div>`;
  const input = document.getElementById("aliasInput");
  const btn = document.getElementById("aliasBtn");
  input.oninput = ()=>{ btn.disabled = !input.value.trim(); };
  input.addEventListener("keydown", e=>{ if(e.key==="Enter" && input.value.trim()) btn.click(); });
  input.focus();
  btn.onclick = ()=>{ S.aliasName = input.value.trim(); renderFinale(); };
}

function renderFinale(){
  stopGameLoop();
  const info = getTitleInfo();
  const origin = buildOriginStory(info);
  window.onkeydown=null; window.onkeyup=null;
  hideMeterBar();
  app.innerHTML = `
    <div class="panel" style="text-align:center;">
      <div class="chapter-tag">Graduation Night</div>
      <h2 class="subtitle">${S.aliasName}</h2>
      <div class="stamp-wrap"><div class="stamp ${info.cls}">${info.title}<span class="sub">${info.pct}% CERTAIN</span></div></div>
      <div class="cut-solo"><canvas id="finalPortrait" width="300" height="380"></canvas></div>
      <div class="final-pcts">
        <div><div class="n" style="color:var(--hero)">${pcts().hero}%</div><div class="l">Hero</div></div>
        <div><div class="n" style="color:var(--villain)">${pcts().villain}%</div><div class="l">Villain</div></div>
        <div><div class="n" style="color:var(--vigilante)">${pcts().vigilante}%</div><div class="l">Vigilante</div></div>
      </div>
      <p style="text-align:left;">${origin}</p>
      <h2 class="subtitle" style="font-size:18px; text-align:left;">Powers</h2>
      <ul class="powerlist" style="text-align:left;">
        ${S.powers.map(id=>`<li><div class="pname">${POWERS[id].name}</div><div class="pdesc">${POWERS[id].desc}</div></li>`).join("") || "<li><div class='pdesc'>None awakened — a rare and strange path.</div></li>"}
      </ul>
      <button class="primary" id="againBtn">Play Again — New Life</button>
    </div>`;
  const sc = document.getElementById("finalPortrait").getContext("2d");
  let t0 = performance.now();
  const anim = setInterval(()=>{
    const t = (performance.now()-t0)/1000;
    sc.clearRect(0,0,300,380);
    const g = sc.createLinearGradient(0,0,0,380);
    g.addColorStop(0, info.cls==="villain"?"#5a2020":info.cls==="vigilante"?"#3a2a4a":"#20365a");
    g.addColorStop(1,"#14141f");
    sc.fillStyle = g; sc.fillRect(0,0,300,380);
    drawHuman(sc, 150, 340, 2.5, S.appearance, {facing:1, idlePhase:t*1.2, gesture: info.cls==="villain"?"villainous":info.cls==="vigilante"?"stealthy":"heroic"});
  }, 60);
  document.getElementById("againBtn").onclick = ()=>{ clearInterval(anim); S=null; renderTitleScreen(); };
}

/* ============================================================
   BOOT
   ============================================================ */
renderTitleScreen();
</script>
